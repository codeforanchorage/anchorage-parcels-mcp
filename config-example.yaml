# OpenContext Configuration Template
# ====================================
#
# Copy this file to config.yaml and customize it for your deployment:
#   cp config-example.yaml config.yaml
#
# ⚠️  IMPORTANT: Enable ONLY ONE plugin per fork/deployment
#
# OpenContext enforces: One Fork = One MCP Server
#
# This keeps deployments:
#   ✓ Simple and focused
#   ✓ Independently scalable
#   ✓ Easy to maintain
#
# To deploy multiple MCP servers:
#   1. Fork this repository again
#   2. Configure ONE plugin per fork
#   3. Deploy each fork separately
#
# See docs/ARCHITECTURE.md for details.

---
# Server metadata
server_name: "Your Organization OpenData MCP" # e.g., "Boston OpenData MCP"
description: "Your organization's open data MCP server - Safe, conversational access to your open data"
organization: "Your Organization Name" # e.g., "City of Boston"

# Plugin configuration
# ====================
#
# IMPORTANT: Enable ONLY ONE plugin below
# For additional MCP servers, fork this repository again
#
plugins:
  # The generic CKAN, ArcGIS Hub and Socrata plugins are not in this
  # repository; they are upstream (CityOfBoston/OpenContext).

  # Built-in: Anchorage Parcels (Municipality of Anchorage
  # property/assessment records; forkable to any city whose assessor
  # publishes a parcel Feature Layer -- see docs/PARCELS.md)
  anchorage_parcels:
    enabled: false # Set to true to use (see config-anchorage-parcels.yaml)
    # Layer URLs default to the MOA endpoints; override all three (plus
    # field_map) to point at another city's assessor layers.
    # property_layer_url: "https://services2.arcgis.com/<org>/arcgis/rest/services/<Property>/FeatureServer/0"
    # addresses_layer_url: "https://services2.arcgis.com/<org>/arcgis/rest/services/<Addresses>/FeatureServer/0"
    # subdivisions_layer_url: "https://services2.arcgis.com/<org>/arcgis/rest/services/<Subdivisions>/FeatureServer/0"
    city_name: "Municipality of Anchorage"
    field_map: {} # logical->physical overrides; see DEFAULT_FIELD_MAP in plugins/anchorage_parcels/plugin.py
    # Seconds for one whole tool call. Keep it BELOW aws.lambda_timeout,
    # which must itself stay below API Gateway's fixed 29s.
    timeout: 20

  # yamllint disable rule:comments-indentation
  # Custom: Add your own plugins here
  # Example:
  # my_custom_plugin:
  #   enabled: false
  #   custom_config_key: "value"
  #   api_endpoint: "https://api.example.com"
  # yamllint enable rule:comments-indentation

# AWS deployment settings
aws:
  region: "us-east-1" # AWS region for Lambda
  lambda_name: "your-opendata-mcp" # Lambda function name (will be auto-generated if not set)
  lambda_memory: 512 # Lambda memory in MB (128-10240)
  # Keep this BELOW 29: the REST API Gateway in front of the Lambda gives
  # up at a fixed 29s, so a longer Lambda timeout only burns compute after
  # the caller already has a 504. The plugin's `timeout` sits below this.
  lambda_timeout: 28

# Logging configuration
logging:
  level: "INFO" # Log level: DEBUG, INFO, WARNING, ERROR
  format: "json" # Log format: json or text
